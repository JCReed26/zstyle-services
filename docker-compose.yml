services:
  memory:
    build:
      context: ./mcp/open_memory/packages/openmemory-js
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OM_PORT=8080
      - OM_TIER=smart
      - OM_EMBEDDINGS=gemini
      - GEMINI_API_KEY=${GOOGLE_API_KEY}
      - OM_EMBEDDING_FALLBACK=synthetic
      - OM_EMBED_MODE=simple
      - OM_DB_PATH=/data/openmemory.sqlite
      - OM_METADATA_BACKEND=sqlite
      - OM_VECTOR_BACKEND=sqlite
    volumes:
      - openmemory_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - copilotkit-network

  strava-mcp:
    build:
      context: ./mcp/strava
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8124:8124"
    environment:
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-http://localhost:8124/strava/callback}
      - STRAVA_TOKEN_PATH=/data/strava_token.json
    volumes:
      - strava_data:/data
    networks:
      - copilotkit-network

  agent:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
    ports:
      - "127.0.0.1:8123:8123"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - OPENMEMORY_MCP_URL=http://memory:8080/mcp
      - STRAVA_MCP_URL=http://strava-mcp:8124/sse
      - GMAIL_TOKEN_PATH=/app/agents/gmail_token.json
      - CALENDAR_TOKEN_PATH=/app/agents/calendar_token.json
      - GOOGLE_CLIENT_SECRETS_PATH=/app/agents/credentials.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - copilotkit-network
    volumes:
      - ./agents:/app/agents
    depends_on:
      memory:
        condition: service_healthy
      strava-mcp:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.app
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - LANGGRAPH_DEPLOYMENT_URL=http://agent:8123
    volumes:
      - ./frontend:/app/frontend
      - ./package.json:/app/package.json
      - ./turbo.json:/app/turbo.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - /app/node_modules
      - /app/frontend/node_modules
    networks:
      - copilotkit-network
    depends_on:
      agent:
        condition: service_healthy

networks:
  copilotkit-network:
    driver: bridge

volumes:
  openmemory_data:
    driver: local
  strava_data:
    driver: local
