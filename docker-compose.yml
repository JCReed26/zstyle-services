# =============================================================================
# ZStyle Services - Docker Compose Configuration
# =============================================================================
#
# SERVICES:
#   app          - Main FastAPI + ADK service (port 8000)
#   telegram-bot - Telegram channel (connects to app)
#   openmemory   - OpenMemory HTTP Server (port 8080)
#
# USAGE:
#   Development:  docker-compose up --build
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Main Application (FastAPI + ADK)
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: zstyle_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      # Override OpenMemory URL for Docker network
      - OPENMEMORY_URL=http://openmemory:8080
      - OM_TIER=hybrid
      # Override DATABASE_URL for Docker network (uses service name 'db')
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zstyle_db}
      # Google ADC configuration
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      # Optional: disable Google tools integration
      - INTEGRATE_GOOGLE_TOOLS=${INTEGRATE_GOOGLE_TOOLS:-true}
    volumes:
      # Mount Google ADC file for service account authentication
      - /Users/jcreed/.config/gcloud/application_default_credentials.json:/root/.config/gcloud/application_default_credentials.json:ro
    depends_on:
      openmemory:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - zstyle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: zstyle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zstyle_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zstyle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-zstyle_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"  # Optional: for local database tools

  # ---------------------------------------------------------------------------
  # Telegram Bot Channel
  # ---------------------------------------------------------------------------
  telegram-bot:
    build: .
    container_name: zstyle_telegram_bot
    restart: unless-stopped
    command: python -m channels.telegram_bot
    env_file:
      - .env
    environment:
      # Point to the app service for API calls
      - AGENT_URL=http://app:8000
    depends_on:
      app:
        condition: service_healthy
    networks:
      - zstyle-network

  # ---------------------------------------------------------------------------
  # OpenMemory HTTP Server
  # ---------------------------------------------------------------------------
  openmemory:
    build:
      context: .
      dockerfile: Dockerfile.openmemory
    container_name: zstyle_openmemory
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # Add OpenMemory-specific env vars if needed
      # - OPENMEMORY_API_KEY=${OPENMEMORY_API_KEY}
      # - OPENMEMORY_STORAGE_PATH=/data
    volumes:
      # Persistent storage for embeddings
      - openmemory-data:/app/data
      # Optional: mount config if OpenMemory supports it
      # - ./openmemory-config:/app/config
    networks:
      - zstyle-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  zstyle-network:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  openmemory-data:
    driver: local
  postgres_data:
    driver: local
    # Optional: specify driver_opts for production
    # driver_opts:
    #   type: nfs
    #   o: addr=your-nfs-server
    #   device: ":/path/to/nfs/share"

# =============================================================================
# NOTES:
# =============================================================================
#
# Key Improvements:
# 1. Explicit Docker network for service communication
# 2. Persistent volume for OpenMemory embeddings
# 3. Build cache for OpenMemory (faster rebuilds)
# 4. Removed SQLite volume (using PostgreSQL)
# 5. Environment variable override for OpenMemory URL
#
# Environment Variables (.env):
#   - All variables from env.example
#   - OPENMEMORY_URL will be overridden to http://openmemory:8080 in Docker
#
# For production:
#   - Use docker-compose.prod.yml override
#   - Add nginx for SSL termination
#   - Use Docker secrets for sensitive data
#   - PostgreSQL runs in local container with persistent volume
#
# =============================================================================