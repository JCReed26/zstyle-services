<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Service</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--tg-theme-hint-color, #999999);
        }
        
        .status {
            font-size: 16px;
            margin-bottom: 30px;
            color: var(--tg-theme-text-color, #000000);
        }
        
        .spinner {
            border: 3px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 3px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: var(--tg-theme-destructive-text-color, #ff0000);
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            color: var(--tg-theme-button-text-color, #ffffff);
            background: var(--tg-theme-button-color, #3390ec);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .button {
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .button:hover {
            opacity: 0.9;
        }
        
        .button:active {
            opacity: 0.8;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="serviceLogo">🔐</div>
        <h1 id="serviceName">Authorizing...</h1>
        <div class="status" id="status">Initializing authorization...</div>
        
        <div class="spinner hidden" id="spinner"></div>
        <div class="error hidden" id="error"></div>
        <div class="success hidden" id="success"></div>
        
        <button class="button hidden" id="retryButton" onclick="retryAuthorization()">Try Again</button>
    </div>
    
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }
        
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const service = urlParams.get('service');
        const userId = urlParams.get('user_id');
        const code = urlParams.get('code');
        const state = urlParams.get('state');
        const error = urlParams.get('error');
        const errorDescription = urlParams.get('error_description');
        
        // Service display names and logos
        const serviceInfo = {
            'google': { name: 'Google', logo: '🔍' },
            'ticktick': { name: 'TickTick', logo: '✓' }
        };
        
        // Update UI based on service
        if (service && serviceInfo[service]) {
            document.getElementById('serviceLogo').textContent = serviceInfo[service].logo;
            document.getElementById('serviceName').textContent = `Authorize ${serviceInfo[service].name}`;
        }
        
        // Handle OAuth callback (user returning from provider)
        if (code && state) {
            handleCallback(code, state);
        } else if (error) {
            handleError(error, errorDescription);
        } else {
            // Start OAuth flow
            initiateAuthorization();
        }
        
        async function initiateAuthorization() {
            if (!service || !userId) {
                showError('Missing required parameters: service and user_id');
                return;
            }
            
            showSpinner();
            document.getElementById('status').textContent = 'Starting authorization...';
            
            try {
                // Call backend to initiate OAuth
                const response = await fetch(`/oauth/${service}/initiate?user_id=${userId}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to initiate authorization');
                }
                
                const data = await response.json();
                
                if (!data.url) {
                    throw new Error('No authorization URL received');
                }
                
                // Redirect to OAuth provider
                document.getElementById('status').textContent = 'Redirecting to authorization page...';
                window.location.href = data.url;
                
            } catch (err) {
                showError(err.message || 'Failed to start authorization');
            }
        }
        
        async function handleCallback(code, state) {
            showSpinner();
            document.getElementById('status').textContent = 'Completing authorization...';
            
            try {
                // The callback endpoint will handle token exchange
                // We just need to show success and close
                // The actual callback processing happens server-side
                
                // Show success message
                hideSpinner();
                document.getElementById('status').textContent = 'Authorization successful!';
                showSuccess('You have successfully authorized the application.');
                
                // Close WebView after short delay
                setTimeout(() => {
                    if (tg) {
                        tg.close();
                    } else {
                        window.close();
                    }
                }, 2000);
                
            } catch (err) {
                showError(err.message || 'Failed to complete authorization');
            }
        }
        
        function handleError(error, description) {
            hideSpinner();
            const errorMsg = description || error || 'Authorization failed';
            showError(errorMsg);
        }
        
        function showSpinner() {
            document.getElementById('spinner').classList.remove('hidden');
        }
        
        function hideSpinner() {
            document.getElementById('spinner').classList.add('hidden');
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('retryButton').classList.remove('hidden');
            document.getElementById('status').textContent = 'Authorization failed';
        }
        
        function showSuccess(message) {
            document.getElementById('success').textContent = message;
            document.getElementById('success').classList.remove('hidden');
        }
        
        function retryAuthorization() {
            document.getElementById('error').classList.add('hidden');
            document.getElementById('retryButton').classList.add('hidden');
            initiateAuthorization();
        }
    </script>
</body>
</html>
